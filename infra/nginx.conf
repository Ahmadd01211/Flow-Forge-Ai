events {}
http {
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream web { zone web 64k; server frontend:3000 resolve; }
  upstream backend { zone backend 64k; server api:8000 resolve; }
  server {
    listen 8080;
    client_max_body_size 600k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /api/ { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    # Node tests carry the draft graph (512 KiB) plus sample input (64 KiB) and step outputs (256 KiB).
    location ~ ^/api/v1/workspaces/[^/]+/workflows/[^/]+/nodes/[^/]+/test$ {
      client_max_body_size 900k;
      proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ { proxy_pass http://backend; }
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
