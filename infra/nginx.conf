events {}
http {
  server_tokens off;
  upstream web { server frontend:3000; }
  upstream backend { server api:8000; }
  server {
    listen 8080;
    client_max_body_size 600k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /api/ { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health/ { proxy_pass http://backend; }
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
