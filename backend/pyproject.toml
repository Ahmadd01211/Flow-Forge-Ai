[project]
name = "flowforge-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2", "argon2-cffi>=23.1,<26",
  "redis>=5,<8", "celery[redis]>=5.5,<6", "jsonschema>=4.26,<5",
  "cryptography>=45,<51", "httpx>=0.28,<1", "mcp>=2.2,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
